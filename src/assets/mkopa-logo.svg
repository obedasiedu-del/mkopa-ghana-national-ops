<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 234 36" fill="none">
  <!-- Wordmark: text color inherits from the surrounding UI (light/dark) via currentColor;
       the brand green "O" and the Ghana flag stay fixed regardless of theme, same as any
       logo's own colors don't shift with the page around it. -->
  <text x="0" y="27" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="700" font-size="26" letter-spacing="-0.02em" fill="currentColor">M-K</text>
  <circle cx="113" cy="18" r="13" fill="#2f6f65"/>
  <rect x="106.5" y="17" width="3" height="7" rx="1" fill="#ffffff"/>
  <rect x="111.5" y="13" width="3" height="11" rx="1" fill="#ffffff"/>
  <rect x="116.5" y="9" width="3" height="15" rx="1" fill="#ffffff"/>
  <text x="128" y="27" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="700" font-size="26" letter-spacing="-0.02em" fill="currentColor">PA</text>
  <!-- The Ghana flag itself: red/gold/green horizontal bands with the black star, clipped to
       a small rounded rect so it reads as a flag swatch next to the wordmark. -->
  <defs>
    <clipPath id="ghFlagClip"><rect x="196" y="6" width="34" height="24" rx="2.5"/></clipPath>
  </defs>
  <g clip-path="url(#ghFlagClip)">
    <rect x="196" y="6" width="34" height="8" fill="#CE1126"/>
    <rect x="196" y="14" width="34" height="8" fill="#FCD116"/>
    <rect x="196" y="22" width="34" height="8" fill="#006B3F"/>
    <path d="M213,14 L213.94,16.71 L216.80,16.76 L214.52,18.49 L215.35,21.24 L213,19.6 L210.65,21.24 L211.48,18.49 L209.20,16.76 L212.06,16.71 Z" fill="#111111"/>
  </g>
  <rect x="196" y="6" width="34" height="24" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.15"/>
</svg>
